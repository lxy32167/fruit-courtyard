<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="慢慢想，一支一支解开。适合 iPad 的箭头解谜小游戏。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <link rel="stylesheet" href="./styles.css">
  <title>箭头出逃 · Arrows</title>
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 19v-8a4 4 0 0 1 4-4h11m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></symbol>
    <symbol id="i-hint" viewBox="0 0 24 24"><path d="M9 18h6m-5 3h4M8 14a7 7 0 1 1 8 0l-1 2H9z"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20S3 14.5 3 8.5a4.5 4.5 0 0 1 9-1 4.5 4.5 0 0 1 9 1C21 14.5 12 20 12 20z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9h4l5-5v16l-5-5H4zm13-1a7 7 0 0 1 0 8m3-11a11 11 0 0 1 0 14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  </defs></svg>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="./" aria-label="箭头出逃首页"><span class="brand-mark"><svg><use href="#i-arrow"/></svg></span><span>箭头出逃<small>ARROWS / ESCAPE</small></span></a>
      <nav class="modes" aria-label="游戏模式">
        <button class="mode active" data-mode="main" aria-pressed="true">经典闯关</button>
        <button class="mode" data-mode="daily" aria-pressed="false">每日一题<span class="dot"></span></button>
        <button class="mode" data-mode="thunderrush" aria-pressed="false">闪电挑战</button>
      </nav>
      <div class="header-actions"><button class="icon-button" id="levels-button" aria-label="选择关卡"><svg><use href="#i-grid"/></svg></button><button class="icon-button" id="settings-button" aria-label="设置"><svg><use href="#i-settings"/></svg></button></div>
    </header>
    <main class="play-area">
      <section class="level-header" aria-label="关卡状态">
        <div class="remaining"><span class="tiny-label">剩余箭头</span><span><strong id="left-count">—</strong><span id="total-count"> / —</span></span></div>
        <div class="level-title"><span id="level-eyebrow">慢慢想，总有出路</span><h1 id="level-title">准备棋盘</h1><span class="difficulty" id="difficulty">正在载入关卡</span></div>
        <div class="life-area"><div id="hearts" class="hearts" role="img" aria-label="3 颗心"></div><span class="tiny-label" id="life-caption">每一步，都从容</span></div>
      </section>
      <div class="progress-track"><div id="progress"></div></div>
      <section class="board-wrap" id="board-wrap" aria-label="箭头棋盘">
        <canvas id="board" tabindex="0" aria-label="箭头棋盘。点击箭头移出；双指缩放，拖动平移。键盘左右键选择箭头，回车移出。"></canvas>
        <div class="board-note" id="board-note"><span class="note-dot"></span><span id="note-text">点击箭头，让它沿着箭头方向离开</span></div>
        <div class="zoom-control"><button id="zoom-out" aria-label="缩小棋盘">−</button><span id="zoom-value">100%</span><button id="zoom-in" aria-label="放大棋盘">+</button></div>
        <div class="loading" id="loading"><span class="loader"></span>正在展开棋盘…</div>
      </section>
      <footer class="play-footer">
        <div class="toolbar"><button class="tool secondary" id="restart"><svg><use href="#i-reset"/></svg><span>重新开始</span></button><button class="tool primary" id="hint"><svg><use href="#i-hint"/></svg><span>给我提示</span><kbd>H</kbd></button><button class="tool secondary" id="fit"><svg><use href="#i-fit"/></svg><span>适合屏幕</span></button></div>
        <p class="gesture-help">轻点移出 <span>·</span> 双指缩放 <span>·</span> 拖动查看 <span class="desktop-only">· 方向键选择，回车移出</span></p>
      </footer>
    </main>
    <div class="bottom-line"><span>一支箭头，一个出口。</span><span id="save-status">进度自动保存在此设备</span></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
